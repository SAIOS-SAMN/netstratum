[package]
name = "lens"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Read-only projections from the chain (#37): the display re-served from the spine, deletable exports made re-derivable — never a second truth"

[dependencies]
cfe = { path = "../cfe" }
codec = { path = "../codec" }
mesh = { path = "../mesh" }
# The peel reads the sealed algebra's own decomposition (19_LENS §3):
# magnification is a DEPTH on `coboundary_reduce`, not a new geometry.
# The arrow is one-way — rfa-core never reaches back (held by
# `deletability::no_sealed_crate_depends_on_a_lens`). The peel takes the
# relation it is given, so the lens needs no kernel dependency to see.
rfa-core = { path = "../rfa-core" }
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
ledger = { path = "../ledger" }
# The scribe writes the fixture exports these pins prove deletable —
# dev-only (a lawful cargo dev-cycle; scribe depends on lens at runtime).
scribe = { path = "../scribe" }

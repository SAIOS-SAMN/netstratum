[package]
name = "solver"
version = "0.1.0"
edition = "2021"
description = "The ARC solver harness — the cognitive apex: exact grid transformations searched over rfa-core-grade discipline, every solution a replayable proof chain"

[dependencies]
blake3.workspace = true
physics = { path = "../physics" }
# THE SECTOR DOOR (cage::consult). The search is prover-side and may use
# any means; what it proposes is withdrawn only through an exact rule.
rfa-core = { path = "../rfa-core" }
solver-verify = { path = "../solver-verify" }
# N-I3 (THE INTELLIGENCE PORT): the solver seat peels its train grids into
# `reduct::FullMeasurement` and reads them through the ONE reduce organ
# (`reduct::think`). A clean new edge — reduct never imports solver/cfe, so no cycle.
reduct = { path = "../reduct" }

[package]
name = "solver-verify"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The sealed verifier half of the ARC harness — everything a REPLAY needs, nothing a SEARCH needs: grids and the one apply path, the task loader, the deterministic forge, the certificate chain. The prover (solver) is free and non-constitutional; this crate is what the kernel calls."

[dependencies]
blake3.workspace = true
physics = { path = "../physics" }
# The spherical FRAME (2026-08-05): the shell addresses cells on the
# 60-slot ring the universe sites its orbs on. The constant lives in
# `ratio` — below every crate — so the solver and the world read one
# turn law rather than two copies.
ratio = { path = "../ratio" }

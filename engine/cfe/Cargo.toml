[package]
name = "cfe"
version = "0.1.0"
edition = "2021"
description = "Canonical Field Engine — the Netstratum runtime evaluating RFA state transitions"

[dependencies]
ratio = { path = "../ratio" }
blake3.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true

# Optional deep rails / X7 adapters: enable without forcing external repos.
# Default off — R1/R2 always lawful; R3/R4 + Anchor export/import optional.
[features]
default = []
deep-rail-strand = []
deep-rail-court = ["deep-rail-strand"]
# Doc aliases (TASKS_TIER X7 / 32_STAMP_MARKET).
stamp-rail-strand = ["deep-rail-strand"]
stamp-rail-court = ["deep-rail-court"]

[dev-dependencies]
# THE FRAME TIE (2026-08-05): the solver names base-11 from below this
# crate's arrow and cannot import LAST_CONDITION. Dev-only, so the
# runtime arrow is untouched (the arrow-law guard's own note: dev-deps
# are lawful cargo cycles), and the equality is pinned rather than
# duplicated.
solver-verify = { path = "../solver-verify" }
# The taxon witness rides the snapshot codec round-trip (dev-only —
# the runtime stays codec-blind; dev cycles are lawful in cargo).
codec = { path = "../codec" }

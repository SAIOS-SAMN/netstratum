[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "THE KERNEL (CHARTER §11 rule 3) — lawful(prior, next, step): the one validated update function. Pure, total, no I/O, encoding-blind. Conservation, containment, and exactness are invariants inside it; an unlawful transition cannot be constructed, only refused. Versioned like the charter — changes are amendments."

[dependencies]
cfe = { path = "../cfe" }
# The sealed verifier half (U1 KERNEL-VERIFY): the kernel CALLS
# verify_work on the opaque payload, never parses it — the arrow
# stays one-way (kernel → sealed math; nothing imports upward).
solver-verify = { path = "../solver-verify" }

[dev-dependencies]
# The PROVER — dev-only, for the witnesses' honest fixtures (a real
# solved forge task). The runtime kernel never searches.
solver = { path = "../solver" }

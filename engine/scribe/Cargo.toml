[package]
name = "scribe"
version = "0.1.0"
edition = "2021"
description = "THE SCRIBE — the display WRITERS, above the lens (#37's inversion): journals, the Terminal Wall, the state/chronicle exports, the solve records. Write-only by law (§11 rule 2): everything here is deletable and regenerates from the chain; nothing here is ever read back AS STATE (line counts over written paper are bookkeeping about paper, not a second source — 19_LENS §15a)."

[dependencies]
kernel = { path = "../kernel" }
cfe = { path = "../cfe" }
ledger = { path = "../ledger" }
lens = { path = "../lens" }
physics = { path = "../physics" }
# The mesh membrane: the kernel attaches as a peer over MY-K via the
# shared attach loop (sdk::attach) — no exporter, no bespoke wire code.
mycelium = { path = "/opt/mycelium" }
# The listening half of the membrane (#132): net HEARS mesh walls through its
# OWN reduce organ (claimant, independent of the mesh's judge) — Understood →
# offer, Learned → grow. Solver carries `hear`; reduct carries the measurement.
solver = { path = "../solver" }
reduct = { path = "../reduct" }

# THE MESH SCRIBE — the kernel's resident pen for the mycelium
# membrane (replaces tools/mesh_feed.py). Peels solve records into
# var/mesh-feed claims; the uniform door does all the speaking.
[[bin]]
name = "mesh-scribe"
path = "src/bin/mesh_scribe.rs"

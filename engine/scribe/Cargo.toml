description = "THE SCRIBE — the display WRITERS, above the lens (#37's inversion): journals, the Terminal Wall, the state/chronicle exports, the solve records. Write-only by law (§11 rule 2): everything here is deletable and regenerates from the chain; nothing here is ever read back AS STATE (line counts over written paper are bookkeeping about paper, not a second source — 19_LENS §15a)."


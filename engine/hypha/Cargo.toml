[package]
name = "ns-hypha"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Netstratum's uplink to a mycelium hypha: the law register, the domain's founding, and the census folds of every colony's holdings, admitted by continuity on the court"

[[bin]]
name = "ns-hypha"
path = "src/main.rs"

[dependencies]
# Mycelium at the workspace's pinned release (the root Cargo.toml).
mycelium.workspace = true
cfe = { path = "../cfe" }
codec = { path = "../codec" }
solver = { path = "../solver" }
tongue = { path = "../tongue" }
# The signature crate mycelium signs folds with (a tier is its key).
ed25519-dalek = "2.1"
blake3.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true

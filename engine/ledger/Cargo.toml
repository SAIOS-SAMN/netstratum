[package]
name = "ledger"
version = "0.1.0"
edition = "2021"
description = "The pre-chain ledger of record and its lens (Charter §11): the steward seam, the fold, identity, the sky — every file-borne path an inventoried Tier-A debt adopted in-chain at #36 — plus the write-only display exports (deletable, never read back, never uplinked)"

[dependencies]
cfe = { path = "../cfe" }
pen = { path = "../pen" }
# The JSON emitter is `pen` — a crate BELOW both this and the lens, so
# the one-way arrow holds without either borrowing the other's writer.
physics = { path = "../physics" }
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
# The scribe — dev-only: the law tests build their fixtures through
# the display writers (a lawful cargo dev-cycle, the guard's note).
scribe = { path = "../scribe" }

[package]
name = "conductor"
version = "0.1.0"
edition = "2021"
description = "The heartbeat — autonomous civilizations play their colonies, grind the forge, drain the steward inbox, and keep the ledger; the board lives before the first human arrives"

[dependencies]
cfe = { path = "../cfe" }
# A1 — CLOSING THE PoUW LOOP (2026-08-01). The conductor is a CLIENT of
# units (16_UNIT §2), and clients import the kernel. It reads
# `mint_bound` so the PROPOSER computes the lawful amount from the SAME
# ruled ladder the judge enforces (call-not-copy, CHARTER §0b), and
# `solver-verify` to encode the proof the deed carries whole.
kernel = { path = "../kernel" }
solver-verify = { path = "../solver-verify" }
# #36 kernel-observed play: the beat chains its committed state —
# the codec produces the bytes, the spine records them.
codec = { path = "../codec" }
ledger = { path = "../ledger" }
mesh = { path = "../mesh" }
physics = { path = "../physics" }
scribe = { path = "../scribe" }
solver = { path = "../solver" }
# COG (doc 52): the thought engine is now a LIVE dependency — the beat peels
# the economy's deficit through the same `overlay` the cognition uses, so
# production (coefficients) and research (residual) are one operation.
reduct = { path = "../reduct" }
# SOC-2: the exact integer Smith Normal Form — the homological pairing that
# reads a species' metabolic complex (Ker/Im/rank of ∂₁) to weight the
# workbench. The topology engine `reduct` itself rests on this.
substrate = { path = "../substrate" }
blake3.workspace = true
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
# The #17 CALIBRATION harness reaches the kernel judge and the sealed
# work-verifier directly to measure mint pressure against the bound.
# Dev-only (the arrow-law guard's own note: dev-deps are lawful).
kernel = { path = "../kernel" }
solver-verify = { path = "../solver-verify" }

[[bin]]
name = "conductor"
path = "src/main.rs"

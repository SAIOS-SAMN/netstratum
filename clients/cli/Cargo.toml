[package]
name = "netstratum-cli"
version = "0.1.0"
edition = "2021"
description = "The Netstratum MUD client — one command launches it (CHARTER §3.5)"

[[bin]]
name = "netstratum"
path = "src/main.rs"

[features]
default = []
# Enable full X7 export/import pins (forwards cfe deep-rail features).
xrail-test = ["cfe/deep-rail-strand", "cfe/deep-rail-court"]

[dependencies]
cfe = { path = "../../engine/cfe" }
ledger = { path = "../../engine/ledger" }
mesh = { path = "../../engine/mesh" }
conductor = { path = "../../engine/conductor" }
kernel = { path = "../../engine/kernel" }
num-bigint.workspace = true
blake3.workspace = true
scribe = { path = "../../engine/scribe" }
# THE CORPUS BENCH (#38): the CLI serves and seals corpus proofs, so it
# holds the sealed math directly — a client above every tier, never an
# upward import (the arrow law constrains the kernel and cfe, not the
# clients that sit above them).
solver-verify = { path = "../../engine/solver-verify" }

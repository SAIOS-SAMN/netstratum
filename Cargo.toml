[workspace]
resolver = "2"
exclude = ["vendor"]
members = [
    "engine/ratio","engine/cfe", "engine/kernel", "engine/codec", "engine/rfa-core", "engine/physics", "engine/solver", "engine/solver-verify", "engine/scribe", "engine/ledger", "engine/lens", "engine/conductor", "engine/mesh", "engine/substrate", "engine/reduct", "clients/cli", "engine/hypha", "engine/tongue", "xtask"]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
# Mycelium, the network substrate Netstratum's engine speaks through (its
# clock, atlas and law forms), pinned at a tagged release; bumping it is a
# deliberate act (CONTRIBUTING.md).
mycelium = { git = "https://github.com/SAIOS-SAMN/mycelium", tag = "v0.2.0" }
forms = { git = "https://github.com/SAIOS-SAMN/mycelium", tag = "v0.2.0" }
blake3 = "1.5"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
# The thought engine's ground (IAE-1, vendored from ipsal-autic-v0.4):
# substrate's exact-ℚ Clifford algebra needs these two beyond the num-*
# trio the game already carries.
num-integer = "0.1"
thiserror = "1.0"

# Optimized tests (operator ruling 2026-08-12): tests were running
# exact-rational physics at opt-level 0 — the slowest possible
# rendition of the hottest code, and the era pins stalled on it
# (measured: ~23s/beat debug vs ~1s/beat release at the same board).
# Tests now compile optimized; debug assertions stay on. The
# structural cure (the checkpointable Replayer) is the next landing —
# this line buys the cadence back, it does not retire the quadratic.
[profile.test]
opt-level = 3

# Dependencies of tests share the optimization (BigRational lives in
# num-* crates — leaving deps at 0 would keep the hot loop slow).
[profile.test.package."*"]
opt-level = 3
